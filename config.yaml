# Single source of truth for dates, horizons, split points, lag rules and strategy parameters.
# Every change here must be logged in DECISIONS.md.

sample:
  start: 2008-01-31
  end: 2025-08-29                # last OptionMetrics date on WRDS — D017 (was 2025-12-31)
  har_burnin_start: 2003-09-10  # first daily TAQ (taqm_2003.ctm_20030910) with SPY trades — D013
horizons: [1, 3, 6]
predictors: [vix, vix_ts, vvix, skew, fund_spread, credit_spread, hkm, cftc_pos]   # Holm family = 8 × 3 [F5]
stage1:
  lp_horizons: [0, 1, 2, 3, 4, 5, 6]   # local projections of VRP on rv_surprise (D033)
  persistent_ar1: 0.9                  # flag predictors with AR(1) above this or ADF p > 0.10
stage2:
  ridge_log10_alpha: [-3, 3, 25]       # grid: numpy.logspace(min, max, n) (D034)
  cv_min_train_months: 60              # first expanding-window CV origin needs ≥ 60 usable training rows
  pca_components_reported: 3
stage3:
  break_trim: 0.15                     # Andrews (1993) sup-Wald trimming
  supwald_sim_reps: 20000              # simulated asymptotic null distribution (D035)
  supwald_sim_grid: 1000
  supwald_boot_reps: 499             # Hansen (2000) fixed-regressor wild bootstrap (headline p-value)
  main_predictors: null                # 🧑 main specification for the break test; null → AR(1) and AR(1) + all predictors
  exclude_crisis: [2008-01-01, 2009-12-31]
stage4:
  min_train_months: 60                 # minimum usable training rows at an OOS origin
  pca_m: [1, 2, 3]                     # PC counts compared on validation (tuned)
  bridge_target: vrp_expost            # k = 0 payoff bridge: vrp_expost_t on vrp_exante_t (+ predictors) [F7]
stage5:
  predictors: [vrp_trail, vrp_exante]  # BTZ trailing VRP (headline Q5) and the ex-ante extension
  min_train_months: 60
vrp_tenor:
  iv_calendar_days: 30
  rv_trading_days: 21
oos:
  train_end: 2015-12-31
  validate_end: 2020-12-31
  holdout_end: 2025-08-29        # D017
target_observation_lag_months:  # [F2][F3] months after t+k by which the target is known (month-granular fallback;
  vrp_exante: 0                 # exact per-row observation dates override this when supplied — see DECISIONS.md)
  vrp_expost: 2                 # 21 trading days after month-end t can end inside month t+2 (e.g. Feb) — conservative
  excess_return: 0
max_stale_days:                 # month-end value set to NaN if the latest available obs is older (hard rule 3)
  fred_daily: 14                # D022: blanks DCPF3M Apr 2020 (not published 2020-03-27 → 2020-05-06)
  bloomberg: 5                  # daily Bloomberg / VIX closes at month-end
  cftc: 35                      # D018: blanks Jan–May 2009 (no reports 2008-12-16 → 2009-06-02); holiday gaps pass
publication_lag:                # [F4]
  fred_daily_bdays: 1           # H.15 CP / T-bill and Moody's yields posted next business day
  hkm_months: 3                 # quarterly book debt released with a lag; robustness: 1
  cftc: release_date            # Tuesday as-of, Friday release
  bloomberg_bdays: 0
cftc:
  contract_code: 1170E1         # Cboe VIX futures, TFF futures-only dataset gpe5-46if (D015)
  shutdown_release_overrides:   # D025: backlog reports released no later than these dates
    - {as_of_from: 2013-10-01, as_of_to: 2013-11-04, release: 2013-11-08}
    - {as_of_from: 2018-12-22, as_of_to: 2019-03-04, release: 2019-03-08}
rf:
  series: DTB3                  # [F13] converted to a monthly holding-period return
har:                            # Phase 2c
  variants: [level, log, iv]
  min_train_days: 250
  iv_daily_source: VIXCLS       # daily VIX close (FRED) for the IV-augmented variant; switch to Bloomberg VIX Index when exported (D030)
  rv_floor: 1.0e-8              # daily-variance floor before logs (log variant; binds only on zero-return days)
  headline: log                 # 🧑 chosen by the user 2026-09-23 after the evaluation (D038)
newey_west:
  rule: "max(k, floor(4*(T/100)**(2/9)))"
  expost_rule: "max(k+1, floor(4*(T/100)**(2/9)))"   # [F6]
bootstrap:
  method: moving_block          # [F11]
  block_length: 6
  reps: 5000
regimes:
  high_vol_vix_percentile: 80
rolling_window_months: 60
seed: 603
strategy:                       # Phase 6
  execution_lag_days: 1
  risk_budget_stress_loss: 0.20
  stress_scenario: {spx_move: -0.15, iv_mult: 2.0}
  cost_hurdle: 1.5
  multiplier_tiers: [0, 0.5, 1.0, 1.5]
  wing_delta: 0.10
  option_spread_theta: {base: 0.5, stress: 1.0}
  option_fee_per_contract: {base: 1.0, stress: 2.0}   # USD all-in per contract, chosen by the user (D043)
  hedge_cost_bp: {base: 1, stress: 2}
  hedge_band_delta: null        # chosen on validation only
  max_oi_share: 0.05
  crra_gammas: [3, 5]
  s2_model: null                # 🧑 Stage 4 bridge model used by S2 (from stage4_selection.csv)
  cap_high_vol: false           # 🧑 set true if Stage 3 finds unstable slopes in high-VIX months
  breakeven_cost_multiples: [0, 0.5, 1, 1.5, 2, 3, 4]
  stress_months: [2008-10, 2011-08, 2015-08, 2018-02, 2020-03, 2022-06, 2025-04]
frozen:                         # Phase 7 pre-registration — filled only from 🧑-approved validation choices
  stage4_models: null           # {0: [...bridge models], 1: [...], 3: [...], 6: [...]} evaluated on the holdout
  stage5_variants: null         # e.g. [unrestricted, slope_restricted, slope_and_premium]
  strategy_variants: null       # e.g. [S0, S1, S2] — S2 only if it beat S1 on validation
  n_trials: null                # number of strategy variants / parameter sets tried (deflated Sharpe, rule 4)
